name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release switch
        id: release
        shell: bash
        run: |
          publish=$(jq -r '.publish' release.json)
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: finance-code/package-lock.json

      - name: Install dependencies
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        working-directory: finance-code
        run: npm ci

      - name: Build for GitHub Pages
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        working-directory: finance-code
        env:
          BASE_PATH: /Finance/
        run: npm run build

      - name: Replace published site at repository root
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          rm -rf assets docs
          rm -f index.html 404.html .nojekyll
          cp -a finance-code/dist/. .
          cp index.html 404.html
          touch .nojekyll
          jq '.publish = false' release.json > release.tmp.json
          mv release.tmp.json release.json

      - name: Commit published site
        if: github.event_name == 'workflow_dispatch' || steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets index.html 404.html .nojekyll release.json
          if git diff --cached --quiet; then
            echo "No site changes to commit."
            exit 0
          fi
          version=$(jq -r '.version' release.json)
          git commit -m "chore: publish v${version} [skip publish]"
          git push
